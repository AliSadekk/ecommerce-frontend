<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase Store</title>
    <link rel="stylesheet" href="../css/shop.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a href="products.html" class="logo"><span class="logo-dot"></span>ShopEase</a>
            <nav class="nav">
                <a href="products.html" class="active">Shop</a>
                <a href="cart.html" class="cart-link" aria-label="Cart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <path d="M6 6h15l-1.5 9h-12z" />
                        <path d="M6 6L5 2H2" />
                        <circle cx="9" cy="20" r="1.5" />
                        <circle cx="18" cy="20" r="1.5" />
                    </svg>
                    <span class="nav-text">Cart</span>
                    <span class="badge" data-cart-count hidden>0</span>
                </a>
                <a href="login.html" data-user-link>Login</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-hero">
            <h1>Discover products you'll love</h1>
            <p>Fresh picks across every category, delivered to your door.</p>
        </section>

        <div class="toolbar">
            <label class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M20 20l-4-4" />
                </svg>
                <input type="search" id="search" class="input" placeholder="Search products..."
                    aria-label="Search products">
            </label>
            <select id="sort" class="select" aria-label="Sort products">
                <option value="">Featured</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="rating_desc">Top Rated</option>
                <option value="title_asc">Name: A to Z</option>
            </select>
        </div>

        <div class="chips" id="categories" role="tablist" aria-label="Categories"></div>

        <p class="results-info" id="results-info" aria-live="polite"></p>
        <div class="grid" id="product-grid"></div>

        <div class="load-more-wrap">
            <button class="btn btn-soft" id="load-more" hidden>Load more</button>
        </div>
    </main>

    <footer class="site-footer">© 2026 Sage Store. All rights reserved.</footer>

    <script src="../js/storage.js"></script>
    <script src="../js/products.js"></script>
</body>

</html>
