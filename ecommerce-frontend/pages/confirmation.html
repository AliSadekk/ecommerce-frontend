<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmed</title>
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/Payment.css">

</head>
<body>

  <nav class="navbar">
    <div class="logo">ShopEase</div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="cart.html">Cart</a>
      <a href="login.html">Login</a>
    </div>
  </nav>
  <div class="page-heading">
    <h1>Order confirmation</h1>
  </div>

  <div class="confirm-wrap">
    <div class="confirm-icon">✓</div>
    <div class="confirm-title">Your order was placed successfully</div>
    <div class="confirm-sub">We'll be in touch shortly to confirm delivery</div>

    <div class="card">
      <div class="order-number" id="order-number">—</div>
      <div id="summary-items"></div>
      <div class="summary-totals">
        <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">—</span></div>
        <div class="summary-row"><span>Shipping</span><span id="sum-shipping">—</span></div>
        <div class="summary-row total"><span>Total</span><span id="sum-total">—</span></div>
      </div>
    </div>

    <a href="home.html" class="back-link">Back to shopping</a>
  </div>

  <script>
    (function () {
      let order = null;
      try {
        order = JSON.parse(localStorage.getItem('lastOrder') || 'null');
      } catch (e) { order = null; }

      if (!order) {
        document.querySelector('.confirm-sub').textContent = 'No current order found.';
        return;
      }

      document.getElementById('order-number').textContent = 'Order number: ' + order.orderNumber;

      const itemsEl = document.getElementById('summary-items');
      (order.items || []).forEach(item => {
        const qty = item.quantity || 1;
        const rawPrice = typeof item.price === 'string'
          ? item.price.replace(/[^\d.-]/g, '')
          : item.price;
        const price = Number(rawPrice) || 0;
        const title = item.title || item.name || 'Product';
        const thumbnail = item.thumbnail || item.image || '';
        const row = document.createElement('div');
        row.className = 'summary-item';
        const image = document.createElement('img');
        image.src = thumbnail;
        image.alt = title;
        image.addEventListener('error', () => image.remove());

        const info = document.createElement('div');
        info.className = 'info';
        const itemTitle = document.createElement('div');
        itemTitle.className = 'title';
        itemTitle.textContent = title;
        const quantity = document.createElement('div');
        quantity.className = 'qty';
        quantity.textContent = `Qty: ${qty}`;
        info.append(itemTitle, quantity);

        const itemPrice = document.createElement('div');
        itemPrice.className = 'price';
        itemPrice.textContent = `$${(price * qty).toFixed(2)}`;
        row.append(image, info, itemPrice);
        itemsEl.appendChild(row);
      });

      const t = order.totals || {};
      document.getElementById('sum-subtotal').textContent = '$' + (t.subtotal || 0).toFixed(2);
      document.getElementById('sum-shipping').textContent = '$' + (t.shipping || 0).toFixed(2);
      document.getElementById('sum-total').textContent = '$' + (t.total || 0).toFixed(2);
    })();
  </script>

</body>
</html>
